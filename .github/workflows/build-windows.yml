name: Build Windows VST3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  JUCE_VERSION: "8.0.13"

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JUCE
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://codeload.github.com/juce-framework/JUCE/zip/refs/tags/8.0.13"
          Invoke-WebRequest -Uri $url -OutFile "JUCE.zip" -UseBasicParsing
          Expand-Archive -Path "JUCE.zip" -DestinationPath "." -Force
          Get-ChildItem -Directory -Filter "JUCE-8*" | Rename-Item -NewName "JUCE"

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target BrainwaveMeter_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrainwaveMeter-Windows-VST3
          path: build/BrainwaveMeter_artefacts/Release/VST3/
          retention-days: 30

name: Build Windows VST3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JUCE 8
        shell: bash
        run: |
          curl -L -o JUCE.zip "https://github.com/juce-framework/JUCE/releases/latest/download/JUCE-8.0.13.zip"
          unzip -q JUCE.zip
          mv JUCE-8.0.13 JUCE

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target BrainwaveMeter_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrainwaveMeter-Windows-VST3
          path: build/BrainwaveMeter_artefacts/Release/VST3/
          retention-days: 30
